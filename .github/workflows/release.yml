# Builds the signed release APK and attaches it to the GitHub release, where Obtainium picks it up.
# Runs when the release drafted by release-drafter is published; can be re-run by hand for an existing tag.
name: Release APK

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build and upload APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LATCH_KEYSTORE_BASE64 }}
        run: |
          # Obtainium only updates an app signed with the same key, so never ship a debug-signed release.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::LATCH_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LATCH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          LATCH_KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
          LATCH_KEY_ALIAS: ${{ secrets.LATCH_KEY_ALIAS }}
          LATCH_KEY_PASSWORD: ${{ secrets.LATCH_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="${TAG#v}"
      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          apk="latch-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber
